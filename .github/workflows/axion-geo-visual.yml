name: AXION-GEO Visual Phase 1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/axion-geo-phase0
    paths:
      - 'geo/src/**'
      - 'geo/data/**'
      - 'geo/tests/**'
      - 'geo/outputs/null_summary_B20000.csv'
      - 'requirements.txt'
      - '.github/workflows/axion-geo-visual.yml'

permissions:
  contents: write

jobs:
  visual-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate AXION-GEO core
        env:
          PYTHONPATH: geo/src
        run: pytest -q geo/tests/test_geometry.py

      - name: Generate visual diagnostics
        run: |
          python geo/src/run_visual_phase1.py \
            --input geo/data/binary_matrix.csv.gz \
            --phase0-summary geo/outputs/null_summary_B20000.csv \
            --output-dir geo/outputs/visuals \
            --windows 1000 500 250

      - name: Verify expected outputs
        run: |
          test -f geo/outputs/visuals/01_heatmap_observado_total.png
          test -f geo/outputs/visuals/02_heatmap_esperado_n0_total.png
          test -f geo/outputs/visuals/03_heatmap_residuo_padronizado_total.png
          test -f geo/outputs/visuals/04_small_multiples_observado_janelas.png
          test -f geo/outputs/visuals/05_small_multiples_residuo_janelas.png
          test -f geo/outputs/visuals/06_barplot_macrogeometria_zscores.png
          test -f geo/outputs/visuals/07_dashboard_fase1_resumo.png
          test -f geo/outputs/visuals/README.md
          test -f geo/outputs/visuals/visuals_summary.csv
          test -f geo/outputs/visuals/visuals_metadata.json
          test -f geo/outputs/visuals/CHECKSUMS.sha256

      - name: Publish job summary
        run: |
          echo '# AXION-GEO - Fase 1 visual' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Execução concluída sobre a matriz congelada dos concursos 1 a 3435.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## Resultado metodológico' >> "$GITHUB_STEP_SUMMARY"
          echo '- Camada visual: exploratória.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Referência por célula: N0 uniforme 15/25, p = 0,60.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Janelas: total, 1000, 500 e 250 concursos.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Nenhum gráfico autoriza alteração de filtros ou pesos.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## Maiores resíduos absolutos por célula' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          d = pd.read_csv('geo/outputs/visuals/visuals_summary.csv')
          d = d[d.window.eq('total')].copy()
          d['abs_z'] = d.z_n0.abs()
          d = d.sort_values('abs_z', ascending=False).head(8)
          print('| Dezena | Linha | Coluna | Taxa observada | z N0 |')
          print('|---:|---:|---:|---:|---:|')
          for _, r in d.iterrows():
              print(f"| {int(r.dezena):02d} | {int(r.row)} | {int(r.col)} | {r.observed_rate:.4f} | {r.z_n0:.3f} |")
          PY
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Os PNGs e o relatório completo são gravados em `geo/outputs/visuals/`.' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo/outputs/visuals
          if git diff --cached --quiet; then
            echo "No visual output changes to commit."
          else
            git commit -m "results: generate AXION-GEO phase 1 visual diagnostics [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload visual package
        uses: actions/upload-artifact@v4
        with:
          name: axion-geo-phase1-visuals
          path: geo/outputs/visuals/
          if-no-files-found: error
          retention-days: 90
